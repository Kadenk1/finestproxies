# Tuned for the actual production VPS (2 vCPU, 7.8GB RAM) — the stock
# postgres:16-alpine image ships defaults sized for a much smaller box
# (shared_buffers=128MB, max_connections=100, work_mem=4MB), which was
# never raised to match real hardware. Confirmed in production (Aug 2026):
# under 15 concurrent gateway resolves, requests queued waiting for a free
# DB connection — max_connections=100 was enough in absolute terms, but
# shared_buffers/work_mem left little headroom for concurrent query work
# once connection_limit was raised app-side (DATABASE_URL's
# connection_limit=40) to actually use more of that 100.
#
# Sizing follows standard PostgreSQL tuning guidance for a dedicated-ish
# workload (this VPS also runs Redis, the app, and gateway-agent, so this
# deliberately does NOT claim the usual "75% of RAM" shared_buffers
# guidance meant for a Postgres-only box):
#   shared_buffers    ~10% of RAM  (7.8GB -> ~768MB)
#   effective_cache_size ~50% of RAM (informs the query planner what's
#                        realistically cacheable OS-wide; doesn't reserve
#                        memory itself)
#   work_mem          conservative — PER sort/hash operation PER connection,
#                      so it multiplies fast under concurrency; sized for
#                      "many small proxy-credential lookups," not analytics
#   max_connections   raised from 100 -> 200 for headroom well above the
#                      app's connection_limit=40, since Postgres itself also
#                      needs a few reserved connections for maintenance

max_connections = 200
shared_buffers = 768MB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 128MB

# Standard safety/performance defaults appropriate for this box's disk
# (confirm SSD-backed on your VPS provider before trusting this value —
# Hostinger VPS plans are SSD-backed as of Aug 2026, per their own specs).
random_page_cost = 1.1
