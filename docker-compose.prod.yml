# Production stack for a self-hosted VPS (e.g. Hostinger VPS). Postgres and
# Redis stay internal to the compose network; Caddy is the only thing
# exposed to the internet and handles automatic HTTPS.
#
# Usage on the server:
#   cp .env.production.example .env.production   # fill in real secrets
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The --env-file flag is required, not optional: Compose only
# auto-loads a file literally named ".env" for the ${VAR} substitutions
# below — since this project's local dev already uses ".env" for
# `npm run dev`, production secrets live in ".env.production" instead,
# which means every `docker compose` invocation against this file must
# pass --env-file .env.production explicitly.
#
# Every service that actually NEEDS a secret at container runtime gets it
# via env_file: (delivered straight into the container's environment,
# exactly like `app` already worked) rather than ${VAR} interpolation in an
# `environment:` block — interpolation only happens at Compose's own
# command-parsing time, so it's evaluated inconsistently across `up` vs
# `run` vs `build` and silently produces a blank value for any invocation
# that forgets --env-file. ${VAR:?err} interpolation is kept ONLY where a
# value has to be substituted into a literal shell command string
# (postgres's healthcheck) rather than delivered as a container env var —
# there, the required-syntax makes a missing value fail loudly at
# `docker compose up` instead of running with a blank password.
#
# This is separate from docker-compose.yml, which is Postgres+Redis only,
# for local development against `npm run dev`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: finestproxies-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # POSTGRES_USER/DB/PASSWORD are delivered by env_file above — Postgres's
      # own entrypoint reads them directly from the container environment,
      # they don't need to be repeated here via ${...} interpolation. This
      # block exists only to apply matching defaults for USER/DB when
      # .env.production leaves them unset (same defaults env_file's absence
      # would otherwise silently fall through to).
      POSTGRES_USER: ${POSTGRES_USER:-finestproxies}
      POSTGRES_DB: ${POSTGRES_DB:-finestproxies}
      # Redundant with env_file's real value AND with the official Postgres
      # image's own entrypoint (which already refuses to start with no
      # password) — kept anyway as a third, Compose-level guard: a missing
      # value here fails `docker compose up` immediately, before Postgres's
      # container even starts, rather than after.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
    volumes:
      - finestproxies_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Interpolated into a literal shell command, not delivered as a
      # container env var — env_file: can't reach this. ${POSTGRES_PASSWORD:?...}
      # isn't needed here since pg_isready doesn't take a password arg; the
      # required-check on the password itself lives on `app`'s DATABASE_URL
      # below, which is the one place an actually-blank password would
      # silently produce a working-looking-but-wrong connection string.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finestproxies} -d ${POSTGRES_DB:-finestproxies}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finestproxies-redis
    restart: unless-stopped
    volumes:
      - finestproxies_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finestproxies-app
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000" # internal only — Caddy is the public entrypoint, not this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-agent:
    build:
      context: ./gateway-agent
      dockerfile: Dockerfile
    container_name: finestproxies-gateway-agent
    restart: unless-stopped
    # GATEWAY_AGENT_SECRET is delivered via env_file (the real value from
    # .env.production), not ${...} interpolation — see the top-of-file note.
    # ${GATEWAY_AGENT_SECRET:?...} below is a second, independent guard: if
    # .env.production is ever missing entirely (e.g. --env-file omitted, or
    # the file itself doesn't exist), env_file: silently contributes nothing
    # and this line is what actually stops `docker compose up` from
    # starting the container at all, rather than relying solely on
    # gateway-agent/index.js's own runtime check (which still exists as a
    # second, independent guard).
    env_file:
      - .env.production
    environment:
      CONTROL_API_BASE: "http://app:3000"
      GATEWAY_AGENT_SECRET: ${GATEWAY_AGENT_SECRET:?GATEWAY_AGENT_SECRET must be set in .env.production}
      GATEWAY_HOSTNAME: ${GATEWAY_HOSTNAME:-proxy.finestproxies.com}
      PORT: "8000"
    ports:
      - "8000:8000" # raw TCP/HTTP proxy protocol, not a website — bypasses Caddy entirely
    depends_on:
      - app

  caddy:
    image: caddy:2-alpine
    container_name: finestproxies-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - finestproxies_caddy_data:/data
      - finestproxies_caddy_config:/config
    depends_on:
      - app

volumes:
  finestproxies_postgres_data:
  finestproxies_redis_data:
  finestproxies_caddy_data:
  finestproxies_caddy_config:
