services:
  postgres:
    image: postgres:16-alpine
    container_name: proxygrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proxygrid
      POSTGRES_PASSWORD: proxygrid_dev_password
      POSTGRES_DB: proxygrid
    ports:
      - "5432:5432"
    volumes:
      - proxygrid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxygrid -d proxygrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: proxygrid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - proxygrid_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proxygrid_postgres_data:
  proxygrid_redis_data:
