name: Deploy to VPS

# Runs deploy.sh on the VPS over SSH on every push to master. deploy.sh
# itself is what decides whether it's safe to auto-restart (no schema
# change) or whether it needs to stop and wait for a human to review and
# apply a migration by hand (schema.prisma changed) — this workflow is
# just the trigger, all the actual safety logic lives in that script so
# manual runs and CI runs behave identically.
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          script: |
            cd ~/finestproxies
            ./deploy.sh
            status=$?
            if [ $status -eq 2 ]; then
              echo "::warning::Schema changed — images built, but migration + restart need manual review on the VPS. See deploy.sh's output above."
              exit 0
            fi
            exit $status
